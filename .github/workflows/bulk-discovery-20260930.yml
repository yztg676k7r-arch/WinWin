name: WinWin Bulk Discovery 2026-09-30

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bulk-discovery-20260930.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winwin-bulk-discovery-20260930
  cancel-in-progress: false

jobs:
  bulk-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Europe/Berlin
    steps:
      - name: Check out WinWin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-scout.txt

      - name: Install dependencies
        run: pip install -r requirements-scout.txt

      - name: Run strict 50-contest discovery
        env:
          WINWIN_BULK_TARGET: '50'
          WINWIN_BULK_MAX_DETAILS: '700'
          WINWIN_BULK_BUDGET_SECONDS: '1800'
        run: python tools/bulk_discovery_20260930.py

      - name: Validate catalog JSON
        run: |
          python -m json.tool contests.json >/dev/null
          python -m json.tool sources.json >/dev/null
          python -m json.tool version.json >/dev/null
          python -m json.tool data/bulk-discovery-2026-09-30.json >/dev/null
          python - <<'PY'
          import json
          r=json.load(open('data/bulk-discovery-2026-09-30.json'))
          assert r.get('success') is True, r
          assert r.get('added') == 50, r
          print(json.dumps(r, ensure_ascii=False, indent=2))
          PY

      - name: Publish 50 new contests
        shell: bash
        run: |
          git config user.name "winwin-bulk-discovery[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contests.json sources.json version.json data/bulk-discovery-2026-09-30.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "feat: add 50 verified contests (2026-09-30)"
          git pull --rebase origin main
          git push origin HEAD:main
