name: Win Win Daily Scout

on:
  schedule:
    # One daily run; delayed starts must still scan.
    - cron: '35 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-scout.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winwin-daily-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Europe/Berlin
    steps:
      - name: Check out Win Win
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-scout.txt

      - name: Install scout
        run: pip install -r requirements-scout.txt

      - name: Run Daily Scout
        env:
          WINWIN_SCOUT_MAX_SOURCES: '30'
          WINWIN_SCOUT_BUDGET_SECONDS: '600'
          WINWIN_SCOUT_MAX_NEW: '15'
        run: python scripts/daily_scout.py

      - name: Re-check review queue
        env:
          WINWIN_REVIEW_BUDGET_SECONDS: '600'
          WINWIN_SCOUT_MAX_NEW: '15'
        run: python scripts/review_queue.py

      - name: Validate generated JSON
        run: |
          python -m json.tool contests.json >/dev/null
          python -m json.tool sources.json >/dev/null
          python -m json.tool data/daily-scout-report.json >/dev/null
          python -m json.tool data/daily-scout-review.json >/dev/null

      - name: Report actual results
        run: |
          python -c "import json; r=json.load(open('data/daily-scout-report.json')); print(json.dumps(r, ensure_ascii=False, indent=2))" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish catalog update
        shell: bash
        run: |
          if git diff --quiet -- contests.json sources.json data/daily-scout-report.json data/daily-scout-review.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "winwin-daily-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contests.json sources.json data/daily-scout-report.json data/daily-scout-review.json
          git commit -m "chore: daily scout + review $(TZ=Europe/Berlin date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
